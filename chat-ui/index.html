<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local AI Chat - 最高品質ローカルAI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --sidebar-bg: #1e293b;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --user-msg-bg: #2563eb;
      --ai-msg-bg: #1e293b;
      --think-bg: #0f172a;
      --think-border: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar {
      width: 280px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }
    .brand-title { font-size: 1.1rem; font-weight: 700; color: #60a5fa; display: flex; align-items: center; gap: 8px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; padding: 4px 8px; border-radius: 9999px; background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
    .status-badge.error { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .status-badge.error .status-dot { background: #f87171; }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    select, input, textarea {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--accent); }

    .btn {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; color: var(--text-main); }
    .btn-secondary:hover { background: #475569; }

    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .message-row { display: flex; gap: 12px; width: 100%; }
    .message-row.user { justify-content: flex-end; }
    .message-row.ai { justify-content: flex-start; }

    .message-bubble {
      max-width: 85%;
      border-radius: 12px;
      padding: 14px 18px;
      line-height: 1.6;
      font-size: 0.95rem;
      position: relative;
    }
    .message-row.user .message-bubble {
      background: var(--user-msg-bg);
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .message-row.ai .message-bubble {
      background: var(--ai-msg-bg);
      border: 1px solid var(--card-border);
      border-bottom-left-radius: 2px;
    }

    /* Thinking Collapsible Box */
    details.thought-process {
      background: var(--think-bg);
      border: 1px solid var(--think-border);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    details.thought-process summary {
      padding: 8px 12px;
      font-size: 0.8rem;
      color: #94a3b8;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.03);
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    details.thought-process summary:hover { color: #cbd5e1; }
    .thought-body {
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #94a3b8;
      white-space: pre-wrap;
      max-height: 250px;
      overflow-y: auto;
      border-top: 1px dashed var(--think-border);
      font-family: monospace;
    }

    /* Markdown elements inside AI response */
    .message-bubble pre {
      background: #090d16;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 10px 0;
      border: 1px solid #334155;
    }
    .message-bubble code { font-family: 'Consolas', monospace; font-size: 0.9em; }
    .message-bubble p { margin-bottom: 8px; }
    .message-bubble p:last-child { margin-bottom: 0; }
    .message-bubble ul, .message-bubble ol { margin-left: 20px; margin-bottom: 8px; }
    .message-bubble table { border-collapse: collapse; margin: 10px 0; width: 100%; }
    .message-bubble th, .message-bubble td { border: 1px solid #475569; padding: 6px 10px; font-size: 0.88rem; }
    .message-bubble th { background: #0f172a; }

    #input-container {
      padding: 16px 24px 24px;
      background: var(--bg-color);
      border-top: 1px solid var(--card-border);
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    .input-wrapper {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      gap: 10px;
      align-items: flex-end;
    }
    .input-wrapper:focus-within { border-color: var(--accent); }
    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      resize: none;
      height: 48px;
      max-height: 180px;
      font-size: 0.95rem;
      padding: 6px 0;
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="brand-title">
      <span>⚡ Local AI Hub</span>
    </div>
    
    <div id="status-container">
      <div id="server-status" class="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">Ollama 接続中...</span>
      </div>
    </div>

    <div class="control-group">
      <label class="control-label" for="model-select">モデル選択</label>
      <select id="model-select"></select>
    </div>

    <div class="control-group">
      <label class="control-label" for="system-prompt">システム指示 (任意)</label>
      <textarea id="system-prompt" rows="3" placeholder="例: あなたは優秀なプログラマーです。日本語で丁寧に答えてください。"></textarea>
    </div>

    <div style="flex: 1;"></div>

    <button id="btn-clear" class="btn btn-secondary">
      🗑️ 会話をクリア
    </button>
  </aside>

  <main id="main-content">
    <div id="chat-messages">
      <div class="message-row ai">
        <div class="message-bubble">
          👋 こんにちは！このPC上で動作するローカルAIです。<br>
          外部サーバーにデータを送信せず、完全にお使いのPC（GPU/CPU）ローカル内で安全に推論を実行します。<br>
          質問やプログラミング、文章作成など何でもお気軽にどうぞ！
        </div>
      </div>
    </div>

    <div id="input-container">
      <div class="input-wrapper">
        <textarea id="user-input" placeholder="メッセージを入力... (Shift+Enterで改行, Enterで送信)"></textarea>
        <button id="btn-send" class="btn btn-primary">送信</button>
      </div>
      <div class="meta-bar">
        <span>Enter: 送信 / Shift+Enter: 改行</span>
        <span id="speed-meter">速度: -- tok/s</span>
      </div>
    </div>
  </main>

  <script>
    const OLLAMA_HOST = 'http://127.0.0.1:11434';
    let conversationHistory = [];
    let isGenerating = false;
    let abortController = null;

    const chatContainer = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const btnSend = document.getElementById('btn-send');
    const btnClear = document.getElementById('btn-clear');
    const modelSelect = document.getElementById('model-select');
    const serverStatus = document.getElementById('server-status');
    const statusText = document.getElementById('status-text');
    const speedMeter = document.getElementById('speed-meter');
    const systemPromptInput = document.getElementById('system-prompt');

    // Auto-resize textarea
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 180) + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    btnSend.addEventListener('click', sendMessage);
    btnClear.addEventListener('click', () => {
      conversationHistory = [];
      chatContainer.innerHTML = `
        <div class="message-row ai">
          <div class="message-bubble">会話履歴をリセットしました。新しいメッセージをどうぞ！</div>
        </div>`;
    });

    async function checkServerAndLoadModels() {
      try {
        const res = await fetch(`${OLLAMA_HOST}/api/tags`);
        if (!res.ok) throw new Error('Status ' + res.status);
        const data = await res.json();
        
        serverStatus.className = 'status-badge';
        statusText.textContent = 'Ollama 接続済み';

        modelSelect.innerHTML = '';
        data.models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.name;
          const sizeGB = (m.size / (1024*1024*1024)).toFixed(1);
          opt.textContent = `${m.name} (${sizeGB} GB)`;
          if (m.name.includes('deepseek-r1:7b')) opt.selected = true;
          modelSelect.appendChild(opt);
        });

      } catch (err) {
        serverStatus.className = 'status-badge error';
        statusText.textContent = 'Ollama 接続不可';
        console.error('Failed to load Ollama tags:', err);
      }
    }

    async function sendMessage() {
      if (isGenerating) {
        if (abortController) abortController.abort();
        return;
      }

      const text = userInput.value.trim();
      if (!text) return;

      const model = modelSelect.value;
      if (!model) {
        alert('モデルが選択されていません。');
        return;
      }

      // Append user message
      conversationHistory.push({ role: 'user', content: text });
      appendMessage('user', text);
      userInput.value = '';
      userInput.style.height = '48px';

      // Prepare UI for AI response
      isGenerating = true;
      btnSend.textContent = '停止';
      btnSend.classList.replace('btn-primary', 'btn-secondary');
      abortController = new AbortController();

      const aiRow = appendMessage('ai', '');
      const aiBubble = aiRow.querySelector('.message-bubble');

      const messagesToSend = [];
      const sysPrompt = systemPromptInput.value.trim();
      if (sysPrompt) {
        messagesToSend.push({ role: 'system', content: sysPrompt });
      }
      messagesToSend.push(...conversationHistory);

      let fullResponse = '';
      let startTime = performance.now();
      let tokenCount = 0;

      try {
        const res = await fetch(`${OLLAMA_HOST}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: model,
            messages: messagesToSend,
            stream: true
          }),
          signal: abortController.signal
        });

        if (!res.ok) throw new Error('HTTP ' + res.status);

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const parsed = JSON.parse(line);
              if (parsed.message?.content) {
                fullResponse += parsed.message.content;
                tokenCount++;
                renderFormattedAIResponse(aiBubble, fullResponse);
                chatContainer.scrollTop = chatContainer.scrollHeight;
              }
              if (parsed.eval_count && parsed.eval_duration) {
                const speed = (parsed.eval_count / (parsed.eval_duration / 1e9)).toFixed(1);
                speedMeter.textContent = `速度: ${speed} tok/s (${parsed.eval_count} tokens)`;
              }
            } catch (e) {
              // Ignore partial JSON
            }
          }
        }

        conversationHistory.push({ role: 'assistant', content: fullResponse });

      } catch (err) {
        if (err.name === 'AbortError') {
          aiBubble.innerHTML += '<br><small style="color:#94a3b8;">[生成を中断しました]</small>';
        } else {
          aiBubble.innerHTML = `<span style="color:#f87171;">エラーが発生しました: ${err.message}</span>`;
        }
      } finally {
        isGenerating = false;
        btnSend.textContent = '送信';
        btnSend.classList.replace('btn-secondary', 'btn-primary');
        abortController = null;
      }
    }

    function renderFormattedAIResponse(bubble, text) {
      // Check for <think> tags (DeepSeek-R1 style)
      const thinkMatch = text.match(/<think>([\s\S]*?)(?:<\/think>|$)/i);
      let contentWithoutThink = text;
      let thinkContent = '';

      if (thinkMatch) {
        thinkContent = thinkMatch[1].trim();
        contentWithoutThink = text.replace(/<think>[\s\S]*?(?:<\/think>|$)/i, '').trim();
      }

      let html = '';
      if (thinkContent) {
        const isClosed = text.includes('</think>');
        const statusBadge = isClosed ? '思考完了' : '思考中...';
        html += `
          <details class="thought-process" ${isClosed ? '' : 'open'}>
            <summary>💭 思考プロセス (${statusBadge})</summary>
            <div class="thought-body">${escapeHtml(thinkContent)}</div>
          </details>
        `;
      }

      if (contentWithoutThink) {
        html += marked.parse(contentWithoutThink);
      } else if (!thinkContent) {
        html += '<span style="color:#94a3b8;">入力待ち...</span>';
      }

      bubble.innerHTML = html;
      bubble.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });
    }

    function appendMessage(role, text) {
      const row = document.createElement('div');
      row.className = `message-row ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      if (role === 'user') {
        bubble.textContent = text;
      } else {
        renderFormattedAIResponse(bubble, text);
      }
      row.appendChild(bubble);
      chatContainer.appendChild(row);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return row;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    checkServerAndLoadModels();
  </script>
</body>
</html>
